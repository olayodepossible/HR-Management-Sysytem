server:
  port: 8080



spring:
  application:
    name: employee-management-api

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:~/testDb
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console


